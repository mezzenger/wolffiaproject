name: Check static site

on:
  push:
  pull_request:

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n launch.sh tests/check-site.sh tests/check-all.sh
      - name: Check source and production artifact
        run: ./tests/check-all.sh
